name = "emaniat-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Cloudflare Workers Observability (metadata & error rates only; audio payloads are never logged)
[observability]
enabled = true
head_sampling_rate = 1

# Optional CPU limit (available on Cloudflare Workers Paid plans only; keep commented on Free tier)
# [limits]
# cpu_ms = 50

[vars]
# Non-secret public configuration:
ALLOWED_ORIGINS = "*"
SUPPORT_EMAIL = "support@immanyat.com"
PRIVACY_LAST_UPDATED = "2026-11-14"

# Secrets (NEVER commit actual secrets here — set them via Wrangler CLI):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put APP_CLIENT_TOKEN          # Optional shared client header guard (matches BuildConfig.BACKEND_CLIENT_TOKEN)
