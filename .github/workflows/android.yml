name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Environment & Debug Keystore
        id: prep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "has_signing_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing_key=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env
          fi
          if [ -n "$STARTIO_APP_ID" ]; then
            sed -i "s|^STARTIO_APP_ID=.*|STARTIO_APP_ID=$STARTIO_APP_ID|" .env
          fi
          if [ -n "$PAYPAL_CLIENT_ID" ]; then
            sed -i "s|^PAYPAL_CLIENT_ID=.*|PAYPAL_CLIENT_ID=$PAYPAL_CLIENT_ID|" .env
          fi
          if [ -n "$PAYPAL_CLIENT_SECRET" ]; then
            sed -i "s|^PAYPAL_CLIENT_SECRET=.*|PAYPAL_CLIENT_SECRET=$PAYPAL_CLIENT_SECRET|" .env
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            case "$GOOGLE_SERVICES_JSON" in
              \{*) printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json ;;
            esac
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found in repo and GOOGLE_SERVICES_JSON secret not set; generating fallback config for APK build."
            FB_KEY="${FIREBASE_API_KEY:-placeholder-firebase-api-key}"
            cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "102717653972",
              "firebase_url": "https://joe-learn-13378-default-rtdb.firebaseio.com",
              "project_id": "joe-learn-13378",
              "storage_bucket": "joe-learn-13378.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:102717653972:android:c81f537b996fdb00740c41",
                  "android_client_info": {
                    "package_name": "com.immanyat.com"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "102717653972-0oi94hdjskso8pp3u9b327tj5imsgip0.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.immanyat.com",
                      "certificate_hash": "5c5f46fcfed0065a21d87f77865645789bfc130f"
                    }
                  },
                  {
                    "client_id": "102717653972-7eb2hcd2l24jo1m773th59d8riem9ih7.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "$FB_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "102717653972-7eb2hcd2l24jo1m773th59d8riem9ih7.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emaniat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build & Sign Release APK (When Signing Secrets Configured)
        if: steps.prep.outputs.has_signing_key == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        run: |
          echo "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_PATH"
          if [ "${ALIAS:-upload}" = "upload" ]; then
            ./gradlew assembleRelease --no-daemon
            SIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
            cp "$SIGNED_APK" app/build/outputs/apk/release/emaniat-release-signed.apk
          else
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$ALIAS" \
              --ks-pass pass:"$STORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out app/build/outputs/apk/release/emaniat-release-signed.apk \
              "$UNSIGNED_APK"
          fi

      - name: Clean Up Release Keystore
        if: always() && steps.prep.outputs.has_signing_key == 'true'
        run: rm -f "${{ github.workspace }}/release.keystore"

      - name: Upload Signed Release APK Artifact
        if: steps.prep.outputs.has_signing_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emaniat-release-signed-apk
          path: app/build/outputs/apk/release/emaniat-release-signed.apk
          if-no-files-found: error
