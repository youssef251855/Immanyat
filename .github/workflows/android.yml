name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradle
      run: chmod +x gradlew || true

    - name: Build Release & Debug APKs
      run: |
        gradle assembleDebug
        gradle assembleRelease

    - name: Sign Release APK
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        ALIAS: ${{ secrets.ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      if: ${{ env.SIGNING_KEY != '' }}
      run: |
        echo "$SIGNING_KEY" | base64 --decode > release.keystore
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
        echo "Using apksigner at: $APKSIGNER"
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "Found APK to sign: $UNSIGNED_APK"
        $APKSIGNER sign --ks release.keystore --ks-key-alias "$ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out app/build/outputs/apk/release/app-release-signed.apk "$UNSIGNED_APK"
        rm -f release.keystore

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Signed Release APK Artifact
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      if: ${{ env.SIGNING_KEY != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed-apk
        path: app/build/outputs/apk/release/app-release-signed.apk
