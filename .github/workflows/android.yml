name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      backend_base_url:
        description: "رابط خادم Cloudflare Worker (مثل https://emaniat-api.xxx.workers.dev)"
        required: false
        type: string
      backend_client_token:
        description: "رمز حماية الباك الاختياري (اختياري فقط إذا فعّلت APP_CLIENT_TOKEN في Cloudflare)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Environment & Debug Keystore
        id: prep
        env:
          RAW_BACKEND_BASE_URL: ${{ github.event.inputs.backend_base_url || secrets.BACKEND_BASE_URL || vars.BACKEND_BASE_URL }}
          RAW_BACKEND_CLIENT_TOKEN: ${{ github.event.inputs.backend_client_token || secrets.BACKEND_CLIENT_TOKEN || secrets.APP_CLIENT_TOKEN || vars.BACKEND_CLIENT_TOKEN || vars.APP_CLIENT_TOKEN }}
          RAW_STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID || vars.STARTIO_APP_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "has_signing_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing_key=false" >> "$GITHUB_OUTPUT"
          fi

          # Normalize Backend URL (trim spaces/newlines/quotes/trailing slash, accidental key prefix, and ensure https://)
          CLEAN_URL=$(printf '%s' "$RAW_BACKEND_BASE_URL" | tr -d '\r\n' | sed -E 's/^[[:space:]"'\'']+//; s/[[:space:]"'\'']+$//; s/^BACKEND_BASE_URL=//i; s/^[[:space:]"'\'']+//; s/[[:space:]"'\'']+$//; s|/*$||')
          if [ -n "$CLEAN_URL" ] && ! printf '%s' "$CLEAN_URL" | grep -qiE '^https?://'; then
            CLEAN_URL="https://$CLEAN_URL"
          fi
          if [ -n "$CLEAN_URL" ] && printf '%s' "$CLEAN_URL" | grep -qiE '^http://'; then
            echo "::error::رابط الباك BACKEND_BASE_URL يجب أن يبدأ بـ https:// (تم إدخال: $CLEAN_URL)."
            exit 1
          fi

          CLEAN_TOKEN=$(printf '%s' "$RAW_BACKEND_CLIENT_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]"'\'']+//; s/[[:space:]"'\'']+$//')
          CLEAN_STARTIO=$(printf '%s' "$RAW_STARTIO_APP_ID" | tr -d '\r\n' | sed -E 's/^[[:space:]"'\'']+//; s/[[:space:]"'\'']+$//')

          FINAL_BACKEND_URL="${CLEAN_URL:-UNCONFIGURED_BACKEND_BASE_URL}"
          FINAL_CLIENT_TOKEN="${CLEAN_TOKEN:-UNCONFIGURED_BACKEND_CLIENT_TOKEN}"
          FINAL_STARTIO_ID="${CLEAN_STARTIO:-200676644}"

          {
            printf 'BACKEND_BASE_URL=%s\n' "$FINAL_BACKEND_URL"
            printf 'BACKEND_CLIENT_TOKEN=%s\n' "$FINAL_CLIENT_TOKEN"
            printf 'STARTIO_APP_ID=%s\n' "$FINAL_STARTIO_ID"
          } > .env

          # Clear any cached generated BuildConfig from restored Gradle/runner state so Secrets Gradle Plugin regenerates it from .env
          rm -rf app/build/generated/source/buildConfig

          if [ "$FINAL_BACKEND_URL" = "UNCONFIGURED_BACKEND_BASE_URL" ]; then
            echo "::warning::BACKEND_BASE_URL غير مضبوط في GitHub Secrets أو Variables؛ سيبنى التطبيق بدون رابط التسميع السحابي."
            echo "backend_configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "Configured BACKEND_BASE_URL in .env for APK/AAB build (length: ${#FINAL_BACKEND_URL})."
            echo "backend_configured=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            case "$GOOGLE_SERVICES_JSON" in
              \{*) printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json ;;
            esac
          elif [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found in repo and GOOGLE_SERVICES_JSON secret not set; generating fallback config for APK build."
            FB_KEY="${FIREBASE_API_KEY:-placeholder-firebase-api-key}"
            cat > app/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "102717653972",
              "firebase_url": "https://joe-learn-13378-default-rtdb.firebaseio.com",
              "project_id": "joe-learn-13378",
              "storage_bucket": "joe-learn-13378.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:102717653972:android:c81f537b996fdb00740c41",
                  "android_client_info": {
                    "package_name": "com.immanyat.com"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "102717653972-0oi94hdjskso8pp3u9b327tj5imsgip0.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.immanyat.com",
                      "certificate_hash": "5c5f46fcfed0065a21d87f77865645789bfc130f"
                    }
                  },
                  {
                    "client_id": "102717653972-7eb2hcd2l24jo1m773th59d8riem9ih7.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "$FB_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "102717653972-7eb2hcd2l24jo1m773th59d8riem9ih7.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Pre-Launch Audit Tests
        run: ./gradlew testDebugUnitTest --tests "com.example.ExampleUnitTest" --tests "com.example.ExampleRobolectricTest" --tests "com.example.PreLaunchAuditTest" --no-daemon --no-configuration-cache --no-build-cache

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --no-build-cache

      - name: Print Debug APK Signing Fingerprints
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          echo "### Debug APK Certificate" >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$DEBUG_APK" | tee -a "$GITHUB_STEP_SUMMARY" || true
          DEBUG_BUILD_CONFIG=$(find app/build/generated/source/buildConfig/debug -name "BuildConfig.java" | head -n 1)
          if [ -n "$DEBUG_BUILD_CONFIG" ]; then
            EMBEDDED_URL=$(awk -F'"' '/BACKEND_BASE_URL/{print $2; exit}' "$DEBUG_BUILD_CONFIG")
            echo "- Debug APK \`BACKEND_BASE_URL\`: \`${EMBEDDED_URL:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emaniat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build & Sign Release AAB and APK (User Upload Key)
        id: release_build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          PASS_A: ${{ secrets.KEYSTORE_PASSWORD }}
          PASS_B: ${{ secrets.STORE_PASSWORD }}
          PASS_C: ${{ secrets.KEY_PASSWORD }}
          ALIAS_INPUT: ${{ secrets.ALIAS || secrets.KEY_ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::المتغير SIGNING_KEY غير مضبوط في GitHub Secrets. تم إيقاف البناء لمنع استخدام مفتاح بديل."
            exit 1
          fi

          # Decode Base64 keystore safely (supports raw base64, line breaks, quotes, or data-URI prefix)
          CLEAN_B64=$(printf '%s' "$SIGNING_KEY" | sed -E 's|^data:[^;]+;base64,||; s|^["'\'']||; s|["'\'']$||' | tr -d '[:space:]')
          if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE_PATH" 2>/dev/null || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::تعذر فك تشفير SIGNING_KEY بصيغة Base64. تأكد من نسخ ناتج base64 لملف المفتاح (.jks أو .keystore) بشكل صحيح."
            exit 1
          fi

          RESOLVED_STORE_PASS=""
          RESOLVED_KEY_PASS=""
          RESOLVED_ALIAS=""
          KEYTOOL_LIST_OUT=""

          # 1) Validate keystore password (storepass)
          for CANDIDATE in "$PASS_A" "$PASS_B" "$PASS_C"; do
            [ -z "$CANDIDATE" ] && continue
            CANDIDATE_TRIMMED=$(printf '%s' "$CANDIDATE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            for P in "$CANDIDATE" "$CANDIDATE_TRIMMED"; do
              [ -z "$P" ] && continue
              if OUT=$(LC_ALL=C keytool -list -keystore "$KEYSTORE_PATH" -storepass "$P" 2>&1); then
                RESOLVED_STORE_PASS="$P"
                KEYTOOL_LIST_OUT="$OUT"
                break 2
              fi
            done
          done

          if [ -z "$RESOLVED_STORE_PASS" ]; then
            echo "::error::فشل التحقق من كلمة مرور المخزن (KEYSTORE_PASSWORD / STORE_PASSWORD) أو ملف SIGNING_KEY غير صالح."
            exit 1
          fi

          # 2) Resolve private key alias from keystore
          AVAILABLE_ALIASES=$(printf '%s\n' "$KEYTOOL_LIST_OUT" | awk -F',' '/PrivateKeyEntry/{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}')
          if [ -z "$AVAILABLE_ALIASES" ]; then
            echo "::error::لم يتم العثور على مفتاح خاص (PrivateKeyEntry) داخل ملف SIGNING_KEY."
            exit 1
          fi

          if [ -n "$ALIAS_INPUT" ]; then
            ALIAS_TRIMMED=$(printf '%s' "$ALIAS_INPUT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            EXACT_MATCH=$(printf '%s\n' "$AVAILABLE_ALIASES" | grep -Fx "$ALIAS_TRIMMED" | head -n 1 || true)
            CASE_MATCH=$(printf '%s\n' "$AVAILABLE_ALIASES" | grep -Fix "$ALIAS_TRIMMED" | head -n 1 || true)
            if [ -n "$EXACT_MATCH" ]; then
              RESOLVED_ALIAS="$EXACT_MATCH"
            elif [ -n "$CASE_MATCH" ]; then
              RESOLVED_ALIAS="$CASE_MATCH"
            else
              echo "::error::الاسم المستعار (Alias) '$ALIAS_TRIMMED' غير موجود في ملف التوقيع. الأسماء المتاحة: $(printf '%s' "$AVAILABLE_ALIASES" | tr '\n' ' ')"
              exit 1
            fi
          else
            RESOLVED_ALIAS=$(printf '%s\n' "$AVAILABLE_ALIASES" | head -n 1)
          fi

          # 3) Validate private key password (keypass) before building
          TMP_DIR=$(mktemp -d)
          printf 'verify\n' > "$TMP_DIR/verify.txt"
          jar cf "$TMP_DIR/test.jar" -C "$TMP_DIR" verify.txt

          for CANDIDATE in "$PASS_C" "$RESOLVED_STORE_PASS" "$PASS_A" "$PASS_B"; do
            [ -z "$CANDIDATE" ] && continue
            CANDIDATE_TRIMMED=$(printf '%s' "$CANDIDATE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            for P in "$CANDIDATE" "$CANDIDATE_TRIMMED"; do
              [ -z "$P" ] && continue
              cp -f "$TMP_DIR/test.jar" "$TMP_DIR/sign_test.jar"
              if LC_ALL=C jarsigner -keystore "$KEYSTORE_PATH" -storepass "$RESOLVED_STORE_PASS" -keypass "$P" "$TMP_DIR/sign_test.jar" "$RESOLVED_ALIAS" >/dev/null 2>&1; then
                RESOLVED_KEY_PASS="$P"
                break 2
              fi
            done
          done
          rm -rf "$TMP_DIR"

          if [ -z "$RESOLVED_KEY_PASS" ]; then
            echo "::error::كلمة مرور المفتاح الخاص (KEY_PASSWORD) غير صحيحة للاسم المستعار '$RESOLVED_ALIAS'."
            exit 1
          fi

          USER_SHA256=$(LC_ALL=C keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$RESOLVED_STORE_PASS" -alias "$RESOLVED_ALIAS" | awk '/SHA256:/{print $2; exit}')
          echo "Verified user signing key -> Alias: $RESOLVED_ALIAS | SHA256: $USER_SHA256"

          export KEYSTORE_PATH
          export STORE_PASSWORD="$RESOLVED_STORE_PASS"
          export KEY_PASSWORD="$RESOLVED_KEY_PASS"

          # 4) Build Release AAB and Release APK signed with the user's exact upload key (bypass stale Gradle caches so .env is always embedded)
          rm -rf app/build/generated/source/buildConfig/release
          ./gradlew generateReleaseBuildConfig bundleRelease assembleRelease --no-daemon --no-configuration-cache --no-build-cache \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$RESOLVED_STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$RESOLVED_ALIAS" \
            -Pandroid.injected.signing.key.password="$RESOLVED_KEY_PASS"

          # 5) Verify Release AAB signature and confirm SHA-256 matches user's keystore
          RAW_AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" ! -name "emaniat-release-signed.aab" | head -n 1)
          if [ -z "$RAW_AAB" ] || [ ! -f "$RAW_AAB" ]; then
            echo "::error::لم يتم العثور على ملف AAB الناتج في app/build/outputs/bundle/release."
            exit 1
          fi
          FINAL_AAB="app/build/outputs/bundle/release/emaniat-release-signed.aab"
          cp -f "$RAW_AAB" "$FINAL_AAB"

          if ! LC_ALL=C jarsigner -verify "$FINAL_AAB" 2>/dev/null | grep -q "jar verified"; then
            echo "Signing AAB with jarsigner using user alias '$RESOLVED_ALIAS'..."
            jarsigner -verbose \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$RESOLVED_STORE_PASS" \
              -keypass "$RESOLVED_KEY_PASS" \
              "$FINAL_AAB" "$RESOLVED_ALIAS"
          fi
          AAB_VERIFY_OUT=$(LC_ALL=C jarsigner -verify "$FINAL_AAB" 2>&1)
          printf '%s\n' "$AAB_VERIFY_OUT"
          if ! printf '%s\n' "$AAB_VERIFY_OUT" | grep -q "jar verified"; then
            echo "::error::فشل التحقق من توقيع ملف AAB بواسطة jarsigner!"
            exit 1
          fi

          USER_SHA256_CLEAN=$(printf '%s' "$USER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          AAB_SHA256=$(LC_ALL=C keytool -printcert -jarfile "$FINAL_AAB" | awk '/SHA256:/{print $2; exit}')
          AAB_SHA256_CLEAN=$(printf '%s' "$AAB_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$AAB_SHA256_CLEAN" ] || [ "$AAB_SHA256_CLEAN" != "$USER_SHA256_CLEAN" ]; then
            echo "::error::بصمة توقيع ملف AAB ($AAB_SHA256) لا تطابق بصمة مفتاحك ($USER_SHA256)!"
            exit 1
          fi

          # 6) Verify Release APK signature and confirm SHA-256 matches user's keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" ! -name "emaniat-release-signed.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::لم يتم العثور على ملف APK الناتج في app/build/outputs/apk/release."
            exit 1
          fi
          FINAL_APK="app/build/outputs/apk/release/emaniat-release-signed.apk"
          if "$APKSIGNER" verify "$RAW_APK" >/dev/null 2>&1; then
            cp -f "$RAW_APK" "$FINAL_APK"
          else
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$RESOLVED_ALIAS" \
              --ks-pass pass:"$RESOLVED_STORE_PASS" \
              --key-pass pass:"$RESOLVED_KEY_PASS" \
              --out "$FINAL_APK" \
              "$RAW_APK"
          fi

          APK_SHA256=$("$APKSIGNER" verify --print-certs "$FINAL_APK" | awk -F'digest: ' '/SHA-256 digest:/{print tolower($2); exit}')
          if [ -z "$APK_SHA256" ] || [ "$APK_SHA256" != "$USER_SHA256_CLEAN" ]; then
            echo "::error::بصمة توقيع ملف APK ($APK_SHA256) لا تطابق بصمة مفتاحك ($USER_SHA256_CLEAN)!"
            exit 1
          fi

          RELEASE_BUILD_CONFIG=$(find app/build/generated/source/buildConfig/release -name "BuildConfig.java" | head -n 1)
          EXPECTED_RELEASE_URL=$(awk -F'=' '/^BACKEND_BASE_URL=/{sub(/^[^=]*=/, ""); print; exit}' .env)
          EMBEDDED_RELEASE_URL="unknown"
          if [ -n "$RELEASE_BUILD_CONFIG" ]; then
            EMBEDDED_RELEASE_URL=$(awk -F'"' '/BACKEND_BASE_URL/{print $2; exit}' "$RELEASE_BUILD_CONFIG")
          fi
          if [ "${{ steps.prep.outputs.backend_configured }}" = "true" ] && [ "$EMBEDDED_RELEASE_URL" != "$EXPECTED_RELEASE_URL" ]; then
            echo "::error::فشل تضمين رابط الباك في BuildConfig لنسخة Release (المتوقع من .env طول=${#EXPECTED_RELEASE_URL}، الموجود: $EMBEDDED_RELEASE_URL)."
            exit 1
          fi

          {
            echo "### Release AAB & APK (Signed with Your Upload Key)"
            echo "- Alias: \`$RESOLVED_ALIAS\`"
            echo "- SHA-256: \`$USER_SHA256\`"
            echo "- Embedded BACKEND_BASE_URL: \`$EMBEDDED_RELEASE_URL\`"
            echo "- AAB: \`$FINAL_AAB\`"
            echo "- APK: \`$FINAL_APK\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "### AAB Certificate" >> "$GITHUB_STEP_SUMMARY"
          LC_ALL=C keytool -printcert -jarfile "$FINAL_AAB" | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "### APK Certificate" >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$FINAL_APK" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"

      - name: Upload Signed Release AAB Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: emaniat-release-signed-aab
          path: app/build/outputs/bundle/release/emaniat-release-signed.aab
          if-no-files-found: error

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emaniat-release-signed-apk
          path: app/build/outputs/apk/release/emaniat-release-signed.apk
          if-no-files-found: error
