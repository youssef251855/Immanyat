name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Environment & Debug Keystore
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env
          fi
          if [ -n "$STARTIO_APP_ID" ]; then
            sed -i "s|^STARTIO_APP_ID=.*|STARTIO_APP_ID=$STARTIO_APP_ID|" .env
          fi
          if [ -n "$PAYPAL_CLIENT_ID" ]; then
            sed -i "s|^PAYPAL_CLIENT_ID=.*|PAYPAL_CLIENT_ID=$PAYPAL_CLIENT_ID|" .env
          fi
          if [ -n "$PAYPAL_CLIENT_SECRET" ]; then
            sed -i "s|^PAYPAL_CLIENT_SECRET=.*|PAYPAL_CLIENT_SECRET=$PAYPAL_CLIENT_SECRET|" .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emaniat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build & Sign Release APK (When Signing Secrets Configured)
        if: ${{ secrets.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        run: |
          echo "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_PATH"
          if [ "${ALIAS:-upload}" = "upload" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/emaniat-release-signed.apk
          else
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$ALIAS" \
              --ks-pass pass:"$STORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out app/build/outputs/apk/release/emaniat-release-signed.apk \
              "$UNSIGNED_APK"
          fi

      - name: Clean Up Release Keystore
        if: always() && secrets.SIGNING_KEY != ''
        run: rm -f "${{ github.workspace }}/release.keystore"

      - name: Upload Signed Release APK Artifact
        if: ${{ secrets.SIGNING_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: emaniat-release-signed-apk
          path: app/build/outputs/apk/release/emaniat-release-signed.apk
          if-no-files-found: error
