name: Deploy Backend to Cloudflare Workers

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test & Deploy Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Worker Unit Tests
        working-directory: cloudflare-worker
        run: npm test

      - name: Validate Required Cloudflare Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::المتغير CLOUDFLARE_API_TOKEN غير مضبوط في GitHub Secrets."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::المتغير CLOUDFLARE_ACCOUNT_ID غير مضبوط في GitHub Secrets."
            exit 1
          fi
          if [ -z "$GEMINI_KEY" ]; then
            echo "::error::المتغير GEMINI_API_KEY غير مضبوط في GitHub Secrets."
            exit 1
          fi

      - name: Deploy Worker & Sync GEMINI_API_KEY
        id: deploy_worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sync Optional APP_CLIENT_TOKEN Secret
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_TOKEN: ${{ secrets.APP_CLIENT_TOKEN || secrets.BACKEND_CLIENT_TOKEN }}
        run: |
          if [ -n "$CLIENT_TOKEN" ]; then
            printf '%s' "$CLIENT_TOKEN" | npx --yes wrangler secret put APP_CLIENT_TOKEN
            echo "Synced optional APP_CLIENT_TOKEN secret."
          else
            echo "No APP_CLIENT_TOKEN / BACKEND_CLIENT_TOKEN configured; skipping optional token."
          fi

      - name: Verify Live Health Endpoint & Write Summary
        env:
          WORKER_URL: ${{ steps.deploy_worker.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare Worker Deployed Successfully"
            if [ -n "$WORKER_URL" ]; then
              CLEAN_URL="${WORKER_URL%/}"
              echo "- **Worker URL (BACKEND_BASE_URL):** \`$CLEAN_URL\`"
              echo "- **Health Check:** \`$CLEAN_URL/health\`"
              echo "- **Privacy Policy (Google Play):** \`$CLEAN_URL/privacy\`"
              echo "- **Delete Account (Google Play):** \`$CLEAN_URL/delete-account\`"
              echo ""
              echo "#### Health Response"
              curl -fsS "$CLEAN_URL/health" | tee -a "$GITHUB_STEP_SUMMARY" || true
            else
              echo "- Deployed \`emaniat-api\` via Wrangler."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
